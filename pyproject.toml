[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-pedagoga"
version = "0.1.0"
description = "Веб-приложение для подготовки календарного плана педагога"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gigachat>=0.2,<1.0",
    "openai>=2.0,<3.0",
    "pymupdf>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "pywin32>=306; platform_system=='Windows'",
    "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
